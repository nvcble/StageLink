[package]
name = "receiver-harness"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Drives receiver-core against the reference transmitter on a virtual clock, so the mobile audio path can be verified without a phone."

[[bin]]
name = "stagelink-receiver-harness"
path = "src/main.rs"

[dependencies]
audio-core = { workspace = true }
audio-protocol = { workspace = true }
receiver-core = { workspace = true }
reference-transmitter = { workspace = true }

anyhow = { workspace = true }
clap = { workspace = true }
hound = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
