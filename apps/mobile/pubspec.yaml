name: stagelink_mobile
description: >-
  StageLink Mobile — the performer's end of a wireless in-ear monitor feed.
  The audio path and the control channel live in Rust (receiver-core,
  receiver-client) behind a narrow C ABI; this app is the screen in front of
  them.
publish_to: none
version: 0.1.1+2

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # State. Riverpod 3 with freezed models.
  #
  # No `riverpod_generator`: it needs analyzer 13 and freezed needs 9-11, and
  # resolving that would mean a prerelease freezed. Providers are written by
  # hand instead, which is idiomatic Riverpod and a few lines more.
  flutter_riverpod: ^3.4.3
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # The FFI seam to receiver-ffi. No audio crosses it; see
  # crates/receiver-ffi/include/stagelink_receiver.h.
  ffi: ^2.1.4

  # Scanning the join QR the desktop displays.
  mobile_scanner: ^7.1.3

  # Local persistence: trusted desktops, key fingerprints, EQ presets.
  # Never the join token — receiver obligation 9.
  drift: ^2.28.2
  sqlite3_flutter_libs: ^0.5.42
  path_provider: ^2.1.5
  path: ^1.9.1

  # The device's long-term keypair, which is how a desktop recognises it
  # across reconnects so an operator's label and a revocation both stick.
  cryptography: ^2.7.0
  flutter_secure_storage: ^9.2.4

  # Keeping the audio alive: foreground service, wake lock, Wi-Fi lock.
  flutter_foreground_task: ^9.1.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  build_runner: ^2.4.15
  drift_dev: ^2.28.2
  ffigen: ^19.1.0
  freezed: ^3.2.3
  json_serializable: ^6.9.5

  # Generates the launcher icons from the official logo; see the config below.
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

# Launcher icons, generated from the official logo.
#
# `assets/branding/StageLink-Logo.png` is the project's visual identity and is
# only ever read — the mipmaps under android/app/src/main/res are the derived
# files. Regenerate after changing it:
#
#   dart run flutter_launcher_icons
flutter_launcher_icons:
  android: ic_launcher
  image_path: ../../assets/branding/StageLink-Logo.png
  min_sdk_android: 29

  # Adaptive, because Android 8+ masks every icon to whatever shape the
  # launcher has chosen. The background is the logo's own backdrop colour
  # (StageColours.background), so the seam is invisible on any mask; the
  # foreground is inset because only the centre of it survives a circular one,
  # and an un-inset logo loses the ends of the waveform.
  adaptive_icon_background: "#080B16"
  adaptive_icon_foreground: ../../assets/branding/StageLink-Logo.png
  adaptive_icon_foreground_inset: 20
